name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Verify source
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: Build portable release
        shell: pwsh
        run: .\scripts\build-release.ps1
      - name: Smoke-test portable release
        shell: pwsh
        run: .\scripts\smoke-release.ps1
      - name: Sign release binaries (required)
        shell: pwsh
        env:
          PROXYDUCK_SIGNING_PFX_BASE64: ${{ secrets.PROXYDUCK_SIGNING_PFX_BASE64 || secrets.PROXYDOCK_SIGNING_PFX_BASE64 }}
          PROXYDUCK_SIGNING_PFX_PASSWORD: ${{ secrets.PROXYDUCK_SIGNING_PFX_PASSWORD || secrets.PROXYDOCK_SIGNING_PFX_PASSWORD }}
        run: .\scripts\sign-release.ps1 -Directory .\release\ProxyDuck -RequireSignature
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          $packageVersion = (Get-Content .\package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) { throw "release version $version does not match package version $packageVersion" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = Get-Command iscc -ErrorAction Stop
          & $iscc.Source "/DAppVersion=${{ steps.version.outputs.value }}" .\installer\ProxyDuck.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
          $installer = ".\release\installer\ProxyDuck-${{ steps.version.outputs.value }}-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Inno Setup did not produce $installer" }
          $build = Get-Content .\release\ProxyDuck\.release-build.json -Raw | ConvertFrom-Json
          [ordered]@{ schemaVersion = 1; version = '${{ steps.version.outputs.value }}'; buildId = $build.buildId; installer = [IO.Path]::GetFileName($installer); generatedAt = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json | Set-Content .\release\installer\ProxyDuck-${{ steps.version.outputs.value }}-setup.exe.build.json -Encoding UTF8
      - name: Sign installer (required)
        shell: pwsh
        env:
          PROXYDUCK_SIGNING_PFX_BASE64: ${{ secrets.PROXYDUCK_SIGNING_PFX_BASE64 || secrets.PROXYDOCK_SIGNING_PFX_BASE64 }}
          PROXYDUCK_SIGNING_PFX_PASSWORD: ${{ secrets.PROXYDUCK_SIGNING_PFX_PASSWORD || secrets.PROXYDOCK_SIGNING_PFX_PASSWORD }}
        run: .\scripts\sign-release.ps1 -Directory .\release\installer -RequireSignature
      - name: Package and hash artifacts
        shell: pwsh
        run: .\scripts\package-release.ps1 -RequireInstaller -RequireSignature -RequireCleanSource
      - uses: actions/upload-artifact@v7
        with:
          name: ProxyDuck-${{ steps.version.outputs.value }}
          path: |
            release/*-portable.zip
            release/installer/*.exe
            release/release-manifest.json
            release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*-portable.zip
            release/installer/*.exe
            release/release-manifest.json
            release/SHA256SUMS.txt
          generate_release_notes: true
