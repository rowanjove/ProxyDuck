name: 错误报告
description: 帮助我们复现并修复 ProxyDuck 的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除代理密码、令牌、真实公网地址、个人目录和无关日志。
  - type: input
    id: version
    attributes:
      label: ProxyDuck 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 安装方式
      options:
        - 安装器
        - 便携包
        - 源码构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动软件开始，按顺序写出最短复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 可附错误文字、截图或经过脱敏的 core.log 片段。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密码、令牌、个人路径和不必要的网络信息
          required: true
